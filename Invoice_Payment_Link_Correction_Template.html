<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .payment-link {
            display: inline-block;
            background-color: #008080;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin: 15px 0;
        }
        .payment-link:hover {
            background-color: #006666;
        }
        .signature {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <p>Dear Dr. [Lastname],</p>
    
    <p>Our invoice had an incomplete payment link to Stripe.</p>
    
    <p>Here is the correct link:</p>
    
    <p><a href="[STRIPE_PAYMENT_URL]" class="payment-link">Click here to pay $[Amount] via Stripe</a></p>
    
    <p>We apologize for the inconvenience.</p>
    
    <div class="signature">
        <p>Best regards,</p>
        <p>Dr. Steve</p>
        <p>HandyWorks Software<br>
        212-889-8878</p>
    </div>
</body>
</html>
